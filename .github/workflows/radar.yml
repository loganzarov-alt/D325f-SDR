name: Build D325f Radar 0.1 Alpha
on:
  push:
    branches: ["prepare/radar-0.1-alpha"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Test ADS-B and AIS decoders
        run: |
          mkdir -p /tmp/radar-tests
          javac -d /tmp/radar-tests app/src/main/java/com/mantz_it/rfanalyzer/radar/RadarDecoder.java tests/radar/RadarSelfTest.java
          java -cp /tmp/radar-tests com.mantz_it.rfanalyzer.radar.RadarSelfTest
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build separately installable Radar APK
        run: ./gradlew --no-daemon -PradarApp=true :app:assembleDebug
      - name: Check package and signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/D325f-Radar-0.1-alpha.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/D325f-Radar-0.1-alpha.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/D325f-Radar-0.1-alpha.apk | grep "package: name='io.github.loganzarov_alt.d325fradar'"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: D325f-Radar-0.1-alpha
          path: dist/
          if-no-files-found: error
          retention-days: 30
