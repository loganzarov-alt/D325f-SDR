name: Build and test D325f SDR
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build APK and run source-selection tests
        run: ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest
      - name: Test audio, IQ continuity, recovery and BT
        run: bash tools/verify-host.sh
      - name: Compile optional native differential test
        run: python3 native/from-source/tests/build-oracle.py
      - name: Verify packaged helpers and notices
        run: python3 tools/verify-apk.py app/build/outputs/apk/release/app-release.apk
      - name: Upload test-signed APK, sources and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/D325f-SDR-1.0.0-ci-test-signed.apk
          git archive --format=tar.gz --prefix=D325f-SDR/ HEAD > dist/D325f-SDR-source.tar.gz
          cd dist
          sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D325f-SDR-1.0.0-ci-test-signed
          retention-days: 30
          if-no-files-found: error
          path: dist/
