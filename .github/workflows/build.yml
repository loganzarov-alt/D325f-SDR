name: Build and test D325f SDR
on:
  workflow_dispatch:
  push:
    branches: [main, "prepare/2.0-*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check license notices in all source files
        run: python3 tools/check-license-headers.py
      - name: Verify translations and offline manual
        run: |
          python3 tools/localization/generate.py
          git diff --exit-code
      - name: Build APK and run source-selection tests
        run: ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest
      - name: Preserve LG APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/D325f-SDR-LG-2.0.4-ci-test-signed.apk
      - name: Build Pixel 4 client (ARM64)
        run: ./gradlew --no-daemon -PnetworkClient=true :app:assembleRelease
      - name: Test network control and resampling
        run: |
          javac -d /tmp/network-tests app/src/main/java/com/mantz_it/rfanalyzer/network/*.java tests/pipeline/TestRtlTcp.java
          java -cp /tmp/network-tests TestRtlTcp
          javac -d /tmp/network-tests app/src/main/java/com/mantz_it/rfanalyzer/source/{IQConverter,SamplePacket,NetworkIQConverter}.java tests/pipeline/TestNetworkMixer.java
          java -cp /tmp/network-tests TestNetworkMixer
          javac -cp /tmp/network-tests -d /tmp/network-tests tests/pipeline/TestLatestFrequency.java
          java -cp /tmp/network-tests TestLatestFrequency
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/pipeline/test_network_resampler.cpp -o /tmp/network-test
          /tmp/network-test
      - name: Test automation decisions
        run: |
          javac -d /tmp/v2-tests app/src/main/java/com/mantz_it/rfanalyzer/automation/CapturePolicy.java tests/pipeline/TestCapturePolicyV2.java app/src/main/java/com/mantz_it/rfanalyzer/automation/IqGap.java tests/pipeline/TestIqGap.java
          java -cp /tmp/v2-tests TestCapturePolicyV2
          java -cp /tmp/v2-tests TestIqGap
          g++ -std=c++17 -Wall -Wextra -Werror tests/pipeline/test_iq_orientation.cpp -o /tmp/iq-test
          /tmp/iq-test
      - name: Test audio, IQ continuity, recovery and BT
        run: bash tools/verify-host.sh
      - name: Compile optional native differential test
        run: python3 native/from-source/tests/build-oracle.py
      - name: Verify packaged helpers and notices
        run: python3 tools/verify-apk.py app/build/outputs/apk/release/app-release.apk
      - name: Upload test-signed APK, sources and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/D325f-SDR-Pixel4-2.0.4-ci-test-signed.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/
          git archive --format=tar.gz --prefix=D325f-SDR/ HEAD > dist/D325f-SDR-source.tar.gz
          cd dist
          sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D325f-SDR-2.0.4-LG-and-Pixel4
          retention-days: 30
          if-no-files-found: error
          path: dist/
