name: Modem patcher source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modem-patcher/**'
      - '.github/workflows/modem-patcher-checks.yml'
  pull_request:
    paths:
      - 'modem-patcher/**'
      - '.github/workflows/modem-patcher-checks.yml'
permissions:
  contents: read
jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modem-patcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published source snapshot
        run: sha256sum -c SOURCE-MANIFEST.sha256
      - name: Compile and test native engine with synthetic images
        run: python3 tests/host-synthetic.py
      - name: Verify source package can be reproduced
        run: python3 package-sources.py
